# Logrotate config for bet-pool-server (copy to /etc/logrotate.d/betpool on the server)
# Install: sudo cp scripts/logrotate.betpool.conf /etc/logrotate.d/betpool
# Edit path below if your app lives elsewhere (e.g. /home/ubuntu/bet-pool-server/logs)

/home/ubuntu/bet-pool-server/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    copytruncate
    notifempty
}
